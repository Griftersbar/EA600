{% extends "admin/base_site.html" %}

{% block userlinks %}
    {% if user.is_superuser %}
        <a href="{% url 'admin_release_notes' %}">Release notes</a> /
    {% endif %}
    {% if perms.wagtailadmin.access_admin %}
        <a href="{% url 'wagtailadmin_home' %}">Wagtail</a> /
    {% endif %}
    {% if perms.siteapp.add_tour or perms.siteapp.change_tour %}
        <a href="{% url 'builder_index' %}">Tour Builder</a> /
    {% endif %}
    {{ block.super }}
{% endblock %}
