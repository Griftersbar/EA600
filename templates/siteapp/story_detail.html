{% extends "siteapp/content_page.html" %}
{% block content %}
    <article class="page-section">
        <div class="container">
            <a class="content-page__back" href="{% url 'home' %}#blog">Stories from the road</a>
            <h1 class="heading-section content-page__title">{{ story.title }}</h1>
            {% if story.author %}<p>By {{ story.author }}</p>{% endif %}
            {% if story.cover %}
                <img class="content-page__cover" src="{{ story.cover.url }}" alt="{{ story.cover.alt_text }}" decoding="async">
            {% endif %}
            <div class="content-page__text">{{ story.body|default:story.excerpt|linebreaks }}</div>
        </div>
    </article>
{% endblock %}
