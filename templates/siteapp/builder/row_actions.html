<div class="builder-row-actions" role="group" aria-label="Reorder or remove {{ item }}">
    <button type="button" data-move="-1" title="Move {{ item }} up" aria-label="Move {{ item }} up">↑</button>
    <button type="button" data-move="1" title="Move {{ item }} down" aria-label="Move {{ item }} down">↓</button>
    <button type="button" data-remove-row title="Remove {{ item }}" aria-label="Remove {{ item }}">×</button>
</div>
