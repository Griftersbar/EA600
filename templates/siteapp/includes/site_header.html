<header class="site-header site-header--dock" data-site-header>
            <div class="site-header__bar container">
                <a href="{% if not is_home %}{% url 'home' %}{% endif %}#top" class="logo" aria-label="{{ homepage.site_title }}">
                    <span class="logo__primary" aria-hidden="true">
                        <span class="logo__layer logo__layer--vector">
                            {% if homepage.logo %}<img decoding="async" fetchpriority="high" loading="eager"
                                src="{{ homepage.logo.url }}"
                                alt=""
                                width="90"
                                height="90"
                            >{% endif %}
                        </span>
                    </span>
                    <span class="logo__badge" aria-hidden="true">
                        {% if homepage.badge_logo %}<img
                            decoding="async"
                            loading="eager"
                            src="{{ homepage.badge_logo.url }}"
                            alt=""
                            width="52"
                            height="52"
                        >{% endif %}
                    </span>
                </a>
                <button
                    type="button"
                    class="site-header__toggle"
                    aria-expanded="false"
                    aria-controls="primary-nav"
                    aria-label="Open menu"
                    data-nav-toggle
                >
                    <span class="site-header__burger" aria-hidden="true"></span>
                </button>
                <nav id="primary-nav" class="nav" aria-label="Primary">
                    <a class="nav__link{% if is_home %} is-active{% endif %}" href="{% if not is_home %}{% url 'home' %}{% endif %}#top"{% if is_home %} data-nav-link{% endif %}>Home</a>
                    <a class="nav__link" href="{% url 'tour_list' %}">Tours</a>
                    <a class="nav__link" href="{% url 'wagtail_serve' '' %}">Guides</a>
                    <a class="nav__link" href="{% if not is_home %}{% url 'home' %}{% endif %}#routes"{% if is_home %} data-nav-link{% endif %}>Route</a>
                    <a class="nav__link" href="{% if not is_home %}{% url 'home' %}{% endif %}#destinations"{% if is_home %} data-nav-link{% endif %}>Destination</a>
                    <a class="nav__link" href="{% if not is_home %}{% url 'home' %}{% endif %}#itinerary"{% if is_home %} data-nav-link{% endif %}>Itinerary</a>
                    <a class="nav__link" href="{% if not is_home %}{% url 'home' %}{% endif %}#planning"{% if is_home %} data-nav-link{% endif %}>Planning</a>
                    <a class="nav__link" href="{% if not is_home %}{% url 'home' %}{% endif %}#blog"{% if is_home %} data-nav-link{% endif %}>Partner</a>
                    <a class="btn btn--primary site-header__nav-cta" href="{% if not is_home %}{% url 'home' %}{% endif %}#planning">{{ homepage.cta_button }}</a>
                </nav>
                <div class="site-header__actions">
                    <a class="btn btn--primary" href="{% if not is_home %}{% url 'home' %}{% endif %}#planning">{{ homepage.cta_button }}</a>
                </div>
            </div>
        </header>
