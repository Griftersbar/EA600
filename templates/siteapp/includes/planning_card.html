<article class="card planning-card{% if tip.panel_left %} planning-card--panel-left{% endif %}{% if tip.link %} card--linked{% endif %}">
    {% include "siteapp/includes/card_photo.html" with photo=tip.photo only %}
    <div class="card__body">
        <div class="planning-card__heading">
            {% if tip.icon %}<img class="planning-card__icon" src="{{ tip.icon.url }}" alt="" width="34" height="34" loading="lazy" decoding="async">{% endif %}
            <h3 class="card__title">{% if tip.link %}<a href="{{ tip.link }}">{{ tip.title }}</a>{% else %}{{ tip.title }}{% endif %}</h3>
        </div>
        <p class="card__text">{{ tip.description|linebreaksbr }}</p>
    </div>
</article>
