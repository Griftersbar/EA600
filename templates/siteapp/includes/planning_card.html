<article class="planning-card{% if tip.panel_left %} planning-card--panel-left{% endif %}">
                        <div class="planning-card__frame">
                            <img
                                class="planning-card__visual"
                                src="{{ tip.photo.url }}"
                                alt="{{ tip.photo.alt_text }}"
                                width="409"
                                height="465"
                                loading="lazy"
                                decoding="async"
                            >
                            {% if tip.link %}<a class="planning-card__action" href="{{ tip.link }}" aria-label="Read more about {{ tip.title }}">
                                <img decoding="async" loading="lazy"
                                    src="/static/assets/icons/arrow-up-right.svg"
                                    alt=""
                                    width="28"
                                    height="28"
                                >
                            </a>{% endif %}
                            <div class="planning-card__panel">
                                <img decoding="async" loading="lazy"
                                    class="planning-card__panel-shape"
                                    src="/static/assets/images/panel-shape.svg"
                                    alt=""
                                    aria-hidden="true"
                                >
                                <div class="planning-card__panel-inner">
                                    {% if tip.icon %}<div class="planning-card__icon" aria-hidden="true">
                                        <img decoding="async" loading="lazy"
                                            src="{{ tip.icon.url }}"
                                            alt=""
                                            width="20"
                                            height="20"
                                        >
                                    </div>{% endif %}
                                    <h3 class="planning-card__title">{{ tip.title }}</h3>
                                    <p class="planning-card__text">{{ tip.description|linebreaksbr }}</p>
                                </div>
                            </div>
                        </div>
                    </article>
